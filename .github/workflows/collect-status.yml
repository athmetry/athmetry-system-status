name: Collect System Status

# Collects pipeline status across athmetry-backend, athmetry-frontend, and
# athmetry-system-status on main and commits data/status.json when changed.
#
# Triggers on completed commit pipelines (CI Integration Tests / Security Scan)
# so collection runs after a commit's workflows reach terminal state instead of
# racing push-triggered workflows, with a 30-minute scheduled fallback and
# workflow_dispatch for manual recovery. Collect System Status itself and Deploy
# to GitHub Pages are deliberately omitted to prevent workflow loops.
#
# Justification: workflow_run is restricted to two trusted main-branch workflows
# with least-privilege checks, trusted default-branch checkout, env-var input
# handling, and no artifact consumption.
on: # zizmor: ignore[dangerous-triggers] workflow_run is restricted to trusted main-branch workflows with no untrusted checkout or artifact consumption
  workflow_run:
    workflows:
      - 'CI Integration Tests'
      - 'Security Scan'
    types: [completed]
    branches: [main]
  schedule:
    # Run automatically every 30 minutes as a fallback.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allow manual execution.

permissions:
  contents: read

concurrency:
  group: collect-status
  # Do not cancel an active run: collect-status.yml is displayed on the
  # dashboard, so cancelling it would surface a Cancelled status.
  cancel-in-progress: false

jobs:
  collect:
    name: Collect pipeline status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.name != 'Collect System Status')

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Use the fine-grained PAT so the workflow can commit back to this repo.
          token: ${{ secrets.ATHMETRY_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "athmetry-status-bot"
          git config user.email "athmetry-status-bot@users.noreply.github.com"

      - name: Collect status data
        id: collect
        env:
          # PAT used exclusively for GitHub API reads (monitored repos).
          ATHMETRY_GITHUB_TOKEN: ${{ secrets.ATHMETRY_GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          ./.github/scripts/collect-status.sh

      - name: Commit and push status data
        if: steps.collect.outcome == 'success'
        env:
          # Built-in GITHUB_TOKEN used exclusively for Git push (never the PAT).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/status.json; then
            echo "No changes to commit."
          else
            COMMIT_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            git add data/status.json
            git commit -m "chore(status): update pipeline status data ($COMMIT_DATE)"
            if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "ERROR: GITHUB_TOKEN is not set." >&2
              exit 1
            fi
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git push origin HEAD:main; then
              # Restore remote URL without embedded token.
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            else
              # Restore remote URL without embedded token even on failure.
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
              exit 1
            fi
          fi
