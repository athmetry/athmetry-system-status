name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run every Monday at 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Scan for secrets and workflow misconfigurations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release.
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          archive="${workdir}/gitleaks.tar.gz"
          curl -sSfL \
            -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${workdir}" gitleaks

          # Scan only tracked files by exporting HEAD, excluding git metadata
          # and any untracked local artifacts from the scan scope.
          tracked="${workdir}/tracked"
          mkdir -p "${tracked}"
          git archive --format=tar HEAD | tar -x -C "${tracked}"

          # --redact prevents secret values from appearing in logs.
          "${workdir}/gitleaks" dir "${tracked}" \
            --no-banner \
            --redact \
            --exit-code 1

      - name: Scan GitHub Actions workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/
          version: '1.32.0'
          config: .github/zizmor.yml
          online-audits: false
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: high
